name: Validate Review Videos

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  validate-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Refresh pilot selection
        run: npm run pick-review-pilot

      - name: Run review validation
        run: npm run validate-reviews

      - name: Build canonical release outputs
        run: env -u FITAPPLIANCE_STORAGE_ROOT npm run build

      - name: Audit review content gate
        run: npm run audit-review-content

      - name: Audit publication boundary
        run: npm run audit:publication-boundary

      - name: Open review validation PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "review validation produced no changes"
            exit 0
          fi
          branch="automation/review-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(review): propose refreshed validation"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(review): refresh validation" \
            --body "Automated review-validation candidate. Merge only after canonical build and PR checks pass."
          gh workflow run pr-validation.yml --ref "$branch"
