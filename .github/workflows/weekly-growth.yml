name: Weekly Growth Pipeline

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build canonical release outputs
        run: env -u FITAPPLIANCE_STORAGE_ROOT npm run build

      - name: Audit publication boundary
        run: npm run audit:publication-boundary

      - name: Open regeneration PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "canonical outputs are current"
            exit 0
          fi
          branch="automation/weekly-growth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(auto): propose weekly canonical regeneration"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(auto): weekly canonical regeneration" \
            --body "Automated canonical-build drift proposal. Merge only after PR validation passes."
          gh workflow run pr-validation.yml --ref "$branch"
