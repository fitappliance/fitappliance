name: Research Popularity Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: research-popularity
  cancel-in-progress: false

jobs:
  research-backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "GITHUB_TOKEN is required"
            exit 1
          fi

      - name: Run popularity research
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/research-popularity.js

      - name: Rebuild canonical production artifacts
        run: env -u FITAPPLIANCE_STORAGE_ROOT npm run build

      - name: Synchronize retailer metrics documentation
        run: node scripts/sync-retailer-metrics-docs.js

      - name: Validate generated retailer data and documentation
        run: |
          npm run validate-schema
          npm run audit-indexability-policy
          node --test tests/catalog-data-cleanup.test.mjs tests/retailer-metrics-copy.test.mjs

      - name: Audit publication boundary
        run: npm run audit:publication-boundary

      - name: Open research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESEARCHED=$(node -p "require('./data/popularity-research.json').last_batch?.researched ?? 0")
          SKIPPED=$(node -p "require('./data/popularity-research.json').last_batch?.skipped ?? 0")
          if [ $((RESEARCHED + SKIPPED)) -eq 0 ]; then
            echo "no progress, skipping PR"
            exit 0
          fi
          branch="automation/research-popularity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git diff --cached --quiet && exit 0
          cursor="$(node -p "try { require('./data/popularity-research.json').cursor ?? 'unknown' } catch { 'unknown' }")"
          git commit -m "chore(backfill): retailer sync cursor=${cursor}"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(backfill): retailer research cursor=${cursor}" \
            --body "Automated popularity-research candidate. Runtime files were regenerated by the canonical build and require PR validation."
          gh workflow run pr-validation.yml --ref "$branch"
